name: lost_dream_messenger_client
description: "Кроссплатформенный Flutter-клиент мессенджера Lost Dream Messenger."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0                 # REST
  web_socket_channel: ^3.0.0   # WS
  provider: ^6.1.0             # управление состоянием
  shared_preferences: ^2.2.0   # хранение JWT
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
